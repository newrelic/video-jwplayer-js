    <!-- new relic tracker -->

    <!-- jwplayer8. REMEMBER TO REPLACE THIS URL WITH YOUR OWN ACCOUNT -->

  <body>
    <div id="myVideo"></div>

    <script type="text/javascript">
      // Setup IMA ads
      ads = {
        client: "googima",

      };

      // Setup player
      var player = jwplayer("myVideo").setup({
        playlist: [
          {
            title: "HLS VOD",
            file: "https://d2zihajmogu5jn.cloudfront.net/bipbop-advanced/bipbop_16x9_variant.m3u8",
          },
          {
            title: "Dash",
            file: "https://storage.googleapis.com/wvmedia/clear/h264/tears/tears.mpd",
          },
          {
            title: "Live HLS",
            file: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
          },
        ],

        advertising: ads,

        autostart: true,
      });

      // set tracker
      /*
    nrvideo.Core.addTracker(new nrvideo.JwplayerTracker(player, { 
      adsTracker: new nrvideo.VideoTracker()
    }))
    */
      nrvideo.Core.addTracker(new nrvideo.JwplayerTracker(player));
    </script>
  </body>
